<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supermercado - Produtos</title>
    <link rel="stylesheet" href="style.css">
</head>
</head>
<body>
    <h1>Cadastrar produto</h1>
    <p><a href="loja.html">Ir para a tela de compras</a></p>

    <form id="form-produto" action="salvar.php" method="post">
        <input type="hidden" id="produto-id" name="id">
        <label for="nome">Nome do produto:</label>
        <input type="text" id="nome" name="nome" maxlength="100" required>

        <br><br>

        <label for="preco">Preço:</label>
        <input type="number" id="preco" name="preco" min="0.01" step="0.01" required>

        <br><br>

        <label for="quantidade">Quantidade em estoque:</label>
        <input type="number" id="quantidade" name="quantidade" min="0" step="1" required>

        <br><br>

        <button type="submit" id="botao-salvar">Cadastrar</button>
<button type="button" id="cancelar-edicao" hidden>Cancelar edição</button>
    </form>
    

    <p id="mensagem"></p>
    <h2>Produtos cadastrados</h2>

<p id="aviso-lista"></p>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Preço</th>
            <th>Estoque</th>
            <th>Ações</th>
        </tr>
    </thead>

    <tbody id="lista-produtos"></tbody>
</table>

    <script src="script.js"></script>
</body>
</html>
</body>
</html>
